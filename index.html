<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tutto Scooter La Spezia</title>

  <!-- SEO base -->
  <link rel="canonical" href="https://tuttoscooter.com/" />

  <script>
    (function () {
      const lang = navigator.language || navigator.userLanguage || "it";
      const shortLang = lang.toLowerCase().slice(0, 2);

      const routes = {
        it: "/it/",
        en: "/en/",
        fr: "/fr/",
        es: "/es/",
        de: "/de/"
      };

      const target = routes[shortLang] || routes.it;

      // evita loop se sei già nella pagina giusta
      if (!window.location.pathname.includes(target)) {
        window.location.replace(target);
      }
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=/it/" />
  </noscript>
</head>

<body>
  <p style="font-family: sans-serif;">
    Redirect in corso...
  </p>
</body>
</html>
